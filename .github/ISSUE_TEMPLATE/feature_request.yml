name: Feature request
description: Something glossator could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The task you want to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work (a command, an option, a field of a record, a profile…).
  - type: textarea
    id: else
    attributes:
      label: Alternatives
      description: What you do instead today, or other tools that do it.
