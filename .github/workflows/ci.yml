name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit (the tag in the comment); Dependabot proposes their updates.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check

  tool:
    name: tool (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest # Apple silicon: PyTorch from PyPI (Metal)
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: poppler-utils (pdfinfo, pdftotext, pdftoppm)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install poppler; else sudo apt-get update && sudo apt-get install -y poppler-utils; fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - name: the demo still passes check
        run: GLOSSATOR_HOME=demo uv run glossator check --all

  docs:
    name: docs (the CLI reference matches the CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: docs/reference/cli.md is what `glossator --help` prints
        if: hashFiles('scripts/gen_cli_reference.py') != ''
        run: uv run python scripts/gen_cli_reference.py --check

  audit:
    name: audit (known vulnerabilities in the locked dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv export --locked --group dev --format requirements-txt --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit==2.10.1 --disable-pip -r requirements-audit.txt

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
